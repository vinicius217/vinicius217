name: Generate contribution graph

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate contribution grids
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-light.svg?palette=github-light
            dist/contributions-dark.svg?palette=github-dark

      - name: make grids static and add labels
        run: |
          node scripts/format-contributions.mjs dist/contributions-light.svg
          node scripts/format-contributions.mjs dist/contributions-dark.svg

      - name: push contribution grids to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: contribution-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
